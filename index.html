/* --- фильтр текста --- */
const fPOS=/фри\s?бет|free\s?-?bet|бесплатн\w*\s+став/i,fNEG=[["бонус за депозит",/депозит|пополнен|deposit|welcome\s+bonus|приветственн\w*\s+бонус/i],["казино",/казино|casino|слот|slots?\b|free\s?spins?|фриспин|покер|рулетк/i],["кэшбэк",/кэшбэк|кешбэк|кэшбек|cash\s?-?back/i],["страховка/ставка без риска",/страховк|без\s+риска|risk[\s-]?free|insur|возврат\s+(?:проигранн|ставк)/i],["скидка",/скидк|discount|распродаж/i],["реферальный бонус",/реферал|пригласи\w*\s+друг|приведи\w*\s+друг|refer(?:ral)?\b/i],["фрибонус/бонус",/фри\s?бонус|free\s?bonus|бонус\w*\s+(?:на|за|до)\s/i]],fACT=/получ|актив|введ|использ|заберит|воспользу|claim|use\s|enter|apply|redeem/i,fDEAD=/истёк|истек|закончил|не\s+действует|больше\s+не|expired|no\s+longer/i,fSTOP=new Set(["FREE","FREEBET","BONUS","CASINO","SPORT","PROMO","CODE","BETS","BETTING"]),fCODE=/(?:[Пп]ромо-?код\w*|ПРОМОКОД|[Pp]romo\s?[Cc]ode|PROMO\s?CODE|[Кк]од|[Cc]ode|CODE)\s*[:\-–—]?\s*["«“'`]?([A-Z0-9]{4,20})(?![A-Za-zА-Яа-я0-9])/g;
function fexp(t){const m=t.match(/(?:до|until|till)\s+(\d{1,2})[./](\d{1,2})[./](\d{2,4})/i);if(m){let y=+m[3];if(y<100)y+=2000;return new Date(y,m[2]-1,+m[1],23,59,59).getTime()}return 0}
function fcls(w){const t=w.replace(/без\s+(?:депозита|пополнения|вложений)/gi,"");if(!fPOS.test(t))return{v:"reject",why:["нет признаков Free Bet"]};const x=fexp(w);if((x&&x<Date.now())||fDEAD.test(w))return{v:"reject",why:["неактуально"]};const n=fNEG.filter(a=>a[1].test(t)).map(a=>a[0]);if(n.length)return{v:"review",why:["рядом упоминается: "+n.join(", ")]};if(!fACT.test(t))return{v:"review",why:["не ясно, что это действующее предложение"]};return{v:"ok",why:["Free Bet + код + условия активации, посторонних бонусов не найдено"]}}
function chkT(){op(`<div class="row"><b style="font-size:18px">Проверка текста фильтром</b><button class="btn g s" onclick="cm()">✕</button></div><div class="k" style="margin:8px 0">Вставьте описание видео или текст акции: фильтр покажет, пройдёт ли код.</div><textarea id="tt" rows="6"></textarea><button class="btn" style="width:100%;margin:10px 0" onclick="runT()">Проверить</button><div id="tr"></div>`)}
function runT(){const t=$("tt").value,r=[],seen=new Set();let m;fCODE.lastIndex=0;while((m=fCODE.exec(t))){const c=m[1];if(fSTOP.has(c)||!/[A-Z]/.test(c)||seen.has(c))continue;seen.add(c);const x=fcls(t.slice(Math.max(0,m.index-250),m.index+350));r.push(`<div class="li"><b>${e(c)}</b> <span class="tag ${x.v==="ok"?"ok":x.v==="review"?"w":"bad"}">${x.v==="ok"?"Проходит фильтр":x.v==="review"?"Требует проверки":"Исключено"}</span><br><small>${e(x.why.join("; "))}</small></div>`)}$("tr").innerHTML=r.join("")||'<div class="k">Промокод в тексте не найден: предложение не создаётся</div>'}

function parseYT(t){t=t.trim();let m;if(/^UC[\w-]{22}$/.test(t))return{ch:t};if(/^@[\w.\-]{3,}$/.test(t))return{h:t};try{const u=new URL(t.includes("://")?t:"https://"+t);if(/(^|\.)youtube\.com$/.test(u.hostname)){m=u.pathname.match(/^\/channel\/(UC[\w-]{22})/);if(m)return{ch:m[1]};m=u.pathname.match(/^\/(@[\w.\-]+)/);if(m)return{h:m[1]}}}catch(_){}return null}
